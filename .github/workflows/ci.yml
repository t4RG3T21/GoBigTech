name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service: [order, inventory, payment]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.1'
    
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Install dependencies
      run: |
        cd services/${{ matrix.service }}
        go mod download
    
    - name: Run tests for ${{ matrix.service }}
      working-directory: ${{ github.workspace }}
      run: |
        if [ "${{ matrix.service }}" = "order" ]; then
          go test -v -coverprofile=services/order/coverage.out -coverpkg=./services/order/internal/service,./services/order/internal/api ./services/order/internal/service ./services/order/internal/api
        elif [ "${{ matrix.service }}" = "inventory" ]; then
          # Сначала прогоняем интеграционные тесты gRPC-сервера (без покрытия)
          go test -v ./services/inventory/cmd/inventory
          # Затем отдельно собираем покрытие для бизнес-логики сервиса
          go test -v -coverprofile=services/inventory/coverage.out ./services/inventory/internal/service
        elif [ "${{ matrix.service }}" = "payment" ]; then
          go test -v ./services/payment/cmd/payment
          go test -v -coverprofile=services/payment/coverage.out ./services/payment/internal/service
        fi
    
    - name: Check coverage for ${{ matrix.service }}
      working-directory: ${{ github.workspace }}
      run: |
        COVERAGE_FILE="services/${{ matrix.service }}/coverage.out"
        if [ -f "$COVERAGE_FILE" ]; then
          echo "Coverage report:"
          go tool cover -func="$COVERAGE_FILE" | tail -1
          COVERAGE=$(go tool cover -func="$COVERAGE_FILE" | grep total | awk '{print $3}' | sed 's/%//')
          echo "Coverage: $COVERAGE%"
          # Use awk for floating point comparison
          COVERAGE_CHECK=$(echo "$COVERAGE 40" | awk '{if ($1 >= $2) print "ok"; else print "fail"}')
          if [ "$COVERAGE_CHECK" = "fail" ]; then
            echo "❌ Coverage is below 40%: $COVERAGE%"
            exit 1
          else
            echo "✅ Coverage is acceptable: $COVERAGE%"
          fi
        else
          echo "❌ No coverage file found at $COVERAGE_FILE"
          exit 1
        fi
    
    - name: Upload coverage to artifacts
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ matrix.service }}
        path: services/${{ matrix.service }}/coverage.out

  coverage-report:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.1'
    
    - name: Download all coverage artifacts
      uses: actions/download-artifact@v4
    
    - name: Generate coverage report
      run: |
        echo "## Coverage Report" >> coverage-report.md
        echo "" >> coverage-report.md
        for service in order inventory payment; do
          if [ -f coverage-$service/coverage.out ]; then
            echo "### $service Service" >> coverage-report.md
            echo '```' >> coverage-report.md
            go tool cover -func=coverage-$service/coverage.out | grep total >> coverage-report.md
            echo '```' >> coverage-report.md
            echo "" >> coverage-report.md
          fi
        done
        cat coverage-report.md

