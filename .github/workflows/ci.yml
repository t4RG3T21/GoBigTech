name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service: [iam, inventory, payment, order]
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      mongodb:
        image: mongo:6-jammy
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password
        options: >-
          --health-cmd "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.1'
    
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Install dependencies
      run: |
        cd services/${{ matrix.service }}
        go mod download
    
    - name: Generate proto files (if needed)
      if: matrix.service == 'iam' || matrix.service == 'inventory' || matrix.service == 'payment'
      run: |
        # Install protoc and plugins
        sudo apt-get update && sudo apt-get install -y protobuf-compiler
        go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.3.0
        
        # Generate proto files
        if [ "${{ matrix.service }}" = "iam" ]; then
          protoc --go_out=services --go_opt=paths=source_relative \
                 --go-grpc_out=services --go-grpc_opt=paths=source_relative \
                 --proto_path=api/proto api/proto/iam/v1/iam.proto
        elif [ "${{ matrix.service }}" = "inventory" ]; then
          protoc --go_out=services --go_opt=paths=source_relative \
                 --go-grpc_out=services --go-grpc_opt=paths=source_relative \
                 --proto_path=api/proto api/proto/inventory/v1/inventory.proto
        elif [ "${{ matrix.service }}" = "payment" ]; then
          protoc --go_out=services --go_opt=paths=source_relative \
                 --go-grpc_out=services --go-grpc_opt=paths=source_relative \
                 --proto_path=api/proto api/proto/payment/v1/payment.proto
        fi
    
    - name: Run tests for ${{ matrix.service }}
      working-directory: ${{ github.workspace }}
      env:
        DATABASE_URL: postgres://postgres:password@localhost:5432/test_db?sslmode=disable
        MONGODB_URL: mongodb://admin:password@localhost:27017
        REDIS_ADDRESS: localhost:6379
      run: |
        if [ "${{ matrix.service }}" = "iam" ]; then
          go test -v -coverprofile=services/iam/coverage.out ./services/iam/internal/service ./services/iam/internal/api
        elif [ "${{ matrix.service }}" = "inventory" ]; then
          go test -v -coverprofile=services/inventory/coverage.out ./services/inventory/internal/service ./services/inventory/internal/repository
        elif [ "${{ matrix.service }}" = "payment" ]; then
          go test -v -coverprofile=services/payment/coverage.out ./services/payment/internal/config ./services/payment/internal/di ./services/payment/internal/service
        elif [ "${{ matrix.service }}" = "order" ]; then
          go test -v -coverprofile=services/order/coverage.out -coverpkg=./services/order/internal/service,./services/order/internal/api ./services/order/internal/service ./services/order/internal/api
        fi
    
    - name: Check coverage for ${{ matrix.service }}
      working-directory: ${{ github.workspace }}
      run: |
        COVERAGE_FILE="services/${{ matrix.service }}/coverage.out"
        if [ -f "$COVERAGE_FILE" ]; then
          echo "Coverage report:"
          go tool cover -func="$COVERAGE_FILE" | tail -1
          COVERAGE=$(go tool cover -func="$COVERAGE_FILE" | grep total | awk '{print $3}' | sed 's/%//')
          echo "Coverage: $COVERAGE%"
          # Use awk for floating point comparison
          COVERAGE_CHECK=$(echo "$COVERAGE 40" | awk '{if ($1 >= $2) print "ok"; else print "fail"}')
          if [ "$COVERAGE_CHECK" = "fail" ]; then
            echo "❌ Coverage is below 40%: $COVERAGE%"
            exit 1
          else
            echo "✅ Coverage is acceptable: $COVERAGE%"
          fi
        else
          echo "⚠️ No coverage file found at $COVERAGE_FILE"
        fi
    
    - name: Upload coverage to artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ matrix.service }}
        path: services/${{ matrix.service }}/coverage.out
        if-no-files-found: ignore

  coverage-report:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.1'
    
    - name: Download all coverage artifacts
      uses: actions/download-artifact@v4
    
    - name: Generate coverage report
      run: |
        echo "## Coverage Report" >> coverage-report.md
        echo "" >> coverage-report.md
        for service in iam inventory payment order; do
          if [ -f coverage-$service/coverage.out ]; then
            echo "### $service Service" >> coverage-report.md
            echo '```' >> coverage-report.md
            go tool cover -func=coverage-$service/coverage.out | grep total >> coverage-report.md
            echo '```' >> coverage-report.md
            echo "" >> coverage-report.md
          fi
        done
        cat coverage-report.md

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        service: [iam, inventory, payment, order, assembly, notification]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.1'
    
    - name: Generate proto files (if needed)
      if: matrix.service == 'iam' || matrix.service == 'inventory' || matrix.service == 'payment'
      run: |
        sudo apt-get update && sudo apt-get install -y protobuf-compiler
        go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.3.0
        
        if [ "${{ matrix.service }}" = "iam" ]; then
          protoc --go_out=services --go_opt=paths=source_relative \
                 --go-grpc_out=services --go-grpc_opt=paths=source_relative \
                 --proto_path=api/proto api/proto/iam/v1/iam.proto
        elif [ "${{ matrix.service }}" = "inventory" ]; then
          protoc --go_out=services --go_opt=paths=source_relative \
                 --go-grpc_out=services --go-grpc_opt=paths=source_relative \
                 --proto_path=api/proto api/proto/inventory/v1/inventory.proto
        elif [ "${{ matrix.service }}" = "payment" ]; then
          protoc --go_out=services --go_opt=paths=source_relative \
                 --go-grpc_out=services --go-grpc_opt=paths=source_relative \
                 --proto_path=api/proto api/proto/payment/v1/payment.proto
        fi
    
    - name: Build ${{ matrix.service }}
      run: |
        cd services/${{ matrix.service }}/cmd/${{ matrix.service }}
        go build -o ${{ matrix.service }} .
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.service }}-binary
        path: services/${{ matrix.service }}/cmd/${{ matrix.service }}/${{ matrix.service }}
        if-no-files-found: ignore
