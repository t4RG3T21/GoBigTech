syntax = "proto3";

package iam.v1;

import "google/api/annotations.proto";

option go_package = "github.com/t4RG3T21/GoBigTech/services/iam/v1;iampb";

service IAMService {
  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/v1/iam/register"
      body: "*"
    };
  }
  
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/iam/login"
      body: "*"
    };
  }
  
  rpc ValidateSession(ValidateSessionRequest) returns (ValidateSessionResponse) {
    option (google.api.http) = {
      post: "/v1/iam/validate-session"
      body: "*"
    };
  }
  
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (google.api.http) = {
      get: "/v1/iam/user/{user_id}"
    };
  }
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string username = 3;
}

message RegisterResponse {
  bool success = 1;
  string user_id = 2;
  string message = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  string username = 3;
}

message LoginResponse {
  bool success = 1;
  string session_id = 2;
  string user_id = 3;
  string message = 4;
}

message ValidateSessionRequest {
  string session_id = 1;
}

message ValidateSessionResponse {
  bool valid = 1;
  string user_id = 2;
  string email = 3;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  string user_id = 1;
  string email = 2;
  string name = 3;
  int64 created_at = 4;
}

