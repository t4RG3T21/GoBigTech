syntax = "proto3";

package iam.v1;

option go_package = "github.com/t4RG3T21/GoBigTech/services/iam/v1;iampb";

service IAMService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc ValidateSession(ValidateSessionRequest) returns (ValidateSessionResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string username = 3;
}

message RegisterResponse {
  bool success = 1;
  string user_id = 2;
  string message = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  string username = 3;
}

message LoginResponse {
  bool success = 1;
  string session_id = 2;
  string user_id = 3;
  string message = 4;
}

message ValidateSessionRequest {
  string session_id = 1;
}

message ValidateSessionResponse {
  bool valid = 1;
  string user_id = 2;
  string email = 3;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  string user_id = 1;
  string email = 2;
  string name = 3;
  int64 created_at = 4;
}

