apiVersion: 1

providers:
  - name: 'Order Service'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
    # Примечание: Дашборды загружаются автоматически при старте Grafana
    # Если дашборд не появился, можно загрузить вручную через UI или API

