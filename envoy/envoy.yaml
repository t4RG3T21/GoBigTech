admin:
  address:
    socket_address:
      protocol: TCP
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    # HTTP Listener на порту 8080
    - name: http_listener
      address:
        socket_address:
          protocol: TCP
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          "@timestamp": "%START_TIME%"
                          "method": "%REQ(:METHOD)%"
                          "path": "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          "protocol": "%PROTOCOL%"
                          "response_code": "%RESPONSE_CODE%"
                          "response_flags": "%RESPONSE_FLAGS%"
                          "bytes_received": "%BYTES_RECEIVED%"
                          "bytes_sent": "%BYTES_SENT%"
                          "duration": "%DURATION%"
                          "upstream_service_time": "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%"
                          "x_forwarded_for": "%REQ(X-FORWARDED-FOR)%"
                          "user_agent": "%REQ(USER-AGENT)%"
                          "request_id": "%REQ(X-REQUEST-ID)%"
                          "authority": "%REQ(:AUTHORITY)%"
                          "upstream_host": "%UPSTREAM_HOST%"
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        filename: /etc/envoy/lua/verify_session.lua
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local_service
                      domains: ["*"]
                      routes:
                        # Order Service routes
                        - match:
                            prefix: "/api/orders"
                          route:
                            cluster: order-service
                            regex_rewrite:
                              pattern:
                                regex: "^/api/orders"
                              substitution: "/orders"
                            timeout: 30s
                            retry_policy:
                              retry_on: "5xx,gateway-error,connect-failure,refused-stream"
                              num_retries: 3
                              per_try_timeout: 10s
                              retry_back_off:
                                base_interval: 0.25s
                                max_interval: 3s
                        # IAM Service routes
                        - match:
                            prefix: "/api/iam"
                          route:
                            cluster: iam-service
                            regex_rewrite:
                              pattern:
                                regex: "^/api/iam(.*)"
                              substitution: "\\1"
                            timeout: 30s
                            retry_policy:
                              retry_on: "5xx,gateway-error,connect-failure,refused-stream"
                              num_retries: 3
                              per_try_timeout: 10s
                              retry_back_off:
                                base_interval: 0.25s
                                max_interval: 3s
                        # Notification Service routes
                        - match:
                            prefix: "/api/notifications"
                          route:
                            cluster: notification-service
                            timeout: 30s
                            retry_policy:
                              retry_on: "5xx,gateway-error,connect-failure,refused-stream"
                              num_retries: 3
                              per_try_timeout: 10s
                              retry_back_off:
                                base_interval: 0.25s
                                max_interval: 3s
                        # Health check routes
                        - match:
                            prefix: "/health"
                          route:
                            cluster: order-service
                            timeout: 5s
                        # Default route
                        - match:
                            prefix: "/"
                          route:
                            cluster: order-service
                            timeout: 30s

    # gRPC Listener на порту 9090 (чистый gRPC)
    - name: grpc_listener
      address:
        socket_address:
          protocol: TCP
          address: 0.0.0.0
          port_value: 9090
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_grpc
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          "@timestamp": "%START_TIME%"
                          "method": "%REQ(:METHOD)%"
                          "path": "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          "protocol": "%PROTOCOL%"
                          "response_code": "%RESPONSE_CODE%"
                          "response_flags": "%RESPONSE_FLAGS%"
                          "grpc_status": "%GRPC_STATUS%"
                          "duration": "%DURATION%"
                          "upstream_service_time": "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%"
                          "upstream_host": "%UPSTREAM_HOST%"
                http_filters:
                  - name: envoy.filters.http.grpc_web
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: grpc_route
                  virtual_hosts:
                    - name: grpc_services
                      domains: ["*"]
                      routes:
                        # IAM Service gRPC
                        - match:
                            prefix: "/iam.v1.IAMService"
                          route:
                            cluster: iam-service-grpc
                            timeout: 30s
                            max_stream_duration:
                              grpc_timeout_header_max: 30s
                        # Inventory Service gRPC
                        - match:
                            prefix: "/inventory.v1.InventoryService"
                          route:
                            cluster: inventory-service-grpc
                            timeout: 30s
                            max_stream_duration:
                              grpc_timeout_header_max: 30s
                        # Payment Service gRPC
                        - match:
                            prefix: "/payment.v1.PaymentService"
                          route:
                            cluster: payment-service-grpc
                            timeout: 30s
                            max_stream_duration:
                              grpc_timeout_header_max: 30s

    # gRPC REST Gateway Listener на порту 8084 (REST→gRPC трансформация)
    # Примечание: 8081 занят Kafka UI, поэтому используется 8084
    - name: grpc_rest_gateway_listener
      address:
        socket_address:
          protocol: TCP
          address: 0.0.0.0
          port_value: 8084
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_grpc_rest
                codec_type: AUTO
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          "@timestamp": "%START_TIME%"
                          "method": "%REQ(:METHOD)%"
                          "path": "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          "protocol": "%PROTOCOL%"
                          "response_code": "%RESPONSE_CODE%"
                          "response_flags": "%RESPONSE_FLAGS%"
                          "grpc_status": "%GRPC_STATUS%"
                          "duration": "%DURATION%"
                          "upstream_service_time": "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%"
                          "upstream_host": "%UPSTREAM_HOST%"
                http_filters:
                  - name: envoy.filters.http.grpc_json_transcoder
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
                      proto_descriptor: "/etc/envoy/proto/inventory_payment.pb"
                      services:
                        - "inventory.v1.InventoryService"
                        - "payment.v1.PaymentService"
                      print_options:
                        add_whitespace: true
                        always_print_primitive_fields: true
                        always_print_enums_as_ints: false
                        preserve_proto_field_names: false
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: grpc_rest_route
                  virtual_hosts:
                    - name: grpc_rest_services
                      domains: ["*"]
                      routes:
                        # Inventory Service REST→gRPC
                        # Формат: /inventory.v1.InventoryService/MethodName
                        - match:
                            prefix: "/inventory.v1.InventoryService"
                          route:
                            cluster: inventory-service-grpc
                            timeout: 30s
                            max_stream_duration:
                              grpc_timeout_header_max: 30s
                        # Payment Service REST→gRPC
                        # Формат: /payment.v1.PaymentService/MethodName
                        - match:
                            prefix: "/payment.v1.PaymentService"
                          route:
                            cluster: payment-service-grpc
                            timeout: 30s
                            max_stream_duration:
                              grpc_timeout_header_max: 30s

  clusters:
    # Order Service cluster (HTTP)
    - name: order-service
      connect_timeout: 5s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 1000
            max_pending_requests: 1000
            max_requests: 1000
            max_retries: 3
          - priority: HIGH
            max_connections: 2000
            max_pending_requests: 2000
            max_requests: 2000
            max_retries: 3
      outlier_detection:
        consecutive_5xx: 5
        interval: 10s
        base_ejection_time: 30s
        max_ejection_percent: 50
        enforcing_consecutive_5xx: 100
      load_assignment:
        cluster_name: order-service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: order-service
                      port_value: 8080
      health_checks:
        - timeout: 1s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 1
          http_health_check:
            path: /health
            expected_statuses:
              - start: 200
                end: 399

    # IAM Service cluster (HTTP Gateway)
    - name: iam-service
      connect_timeout: 5s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 1000
            max_pending_requests: 1000
            max_requests: 1000
            max_retries: 3
      outlier_detection:
        consecutive_5xx: 5
        interval: 10s
        base_ejection_time: 30s
        max_ejection_percent: 50
      load_assignment:
        cluster_name: iam-service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: iam-service
                      port_value: 8082
      health_checks:
        - timeout: 1s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 1
          http_health_check:
            path: /v1/iam/health
            expected_statuses:
              - start: 200
                end: 399

    # IAM Service cluster (gRPC)
    - name: iam-service-grpc
      connect_timeout: 5s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      http2_protocol_options: {}
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 1000
            max_pending_requests: 1000
            max_requests: 1000
            max_retries: 3
      outlier_detection:
        consecutive_5xx: 5
        interval: 10s
        base_ejection_time: 30s
        max_ejection_percent: 50
      load_assignment:
        cluster_name: iam-service-grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: iam-service
                      port_value: 50053

    # Inventory Service cluster (gRPC)
    - name: inventory-service-grpc
      connect_timeout: 5s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      http2_protocol_options: {}
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 1000
            max_pending_requests: 1000
            max_requests: 1000
            max_retries: 3
      outlier_detection:
        consecutive_5xx: 5
        interval: 10s
        base_ejection_time: 30s
        max_ejection_percent: 50
      load_assignment:
        cluster_name: inventory-service-grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: inventory-service
                      port_value: 50051

    # Payment Service cluster (gRPC)
    - name: payment-service-grpc
      connect_timeout: 5s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      http2_protocol_options: {}
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 1000
            max_pending_requests: 1000
            max_requests: 1000
            max_retries: 3
      outlier_detection:
        consecutive_5xx: 5
        interval: 10s
        base_ejection_time: 30s
        max_ejection_percent: 50
      load_assignment:
        cluster_name: payment-service-grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: payment-service
                      port_value: 50052

    # Notification Service cluster (HTTP)
    - name: notification-service
      connect_timeout: 5s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 1000
            max_pending_requests: 1000
            max_requests: 1000
            max_retries: 3
      outlier_detection:
        consecutive_5xx: 5
        interval: 10s
        base_ejection_time: 30s
        max_ejection_percent: 50
      load_assignment:
        cluster_name: notification-service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: notification-service
                      port_value: 8083
      health_checks:
        - timeout: 1s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 1
          http_health_check:
            path: /health
            expected_statuses:
              - start: 200
                end: 399
